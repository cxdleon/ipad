name: iPadOS 13 Minimal Test IPA

# Minimal, unsigned UIKit test app. Targets iOS 13.0 for iPadOS 13.5.1.
# No Flutter, no CocoaPods, no Xcode project file - just clang + zip, a few seconds.
on:
  workflow_dispatch:

jobs:
  build-test-ipa:
    # macos-15 defaults to Xcode 16.4. Xcode 26 (macos-latest) cannot target iOS 13.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16 or older
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 16/15 on this runner; Xcode 26 cannot target iOS 13."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build minimal unsigned IPA (iOS 13.0)
        run: |
          chmod +x ./build_test_ipa.sh
          ./build_test_ipa.sh

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipados13-test-ipa
          path: ipados13-test.ipa
          if-no-files-found: error
          retention-days: 7
