<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东哥音乐网 · 界面预览</title>
<style>
  html, body { height: 100%; margin: 0; background: #07090d; }
  #frame { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; border: 0; background: #0b0e14; }
  #tip {
    position: fixed; left: 50%; transform: translateX(-50%); top: 14px; z-index: 99;
    padding: 6px 12px; border-radius: 8px;
    background: rgba(255, 193, 7, .14); color: #ffd45e;
    border: 1px solid rgba(255, 193, 7, .3);
    font: 11px/1.5 -apple-system, "PingFang SC", sans-serif;
    pointer-events: none;
    animation: tipOut .5s ease 4s forwards;
  }
  @keyframes tipOut { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
<div id="tip">预览模式 · 模拟数据（真机走真实接口）</div>
<iframe id="frame" src="index.html"></iframe>
<script>
/* ------------------------------------------------------------------
 * Mock native bridge. Defined on the parent BEFORE the iframe loads,
 * so the child's shim.js can find it synchronously at parse time.
 * ------------------------------------------------------------------ */
var SAMPLE = null;
function silentWav() {
  if (SAMPLE) return SAMPLE;
  var sr = 8000, sec = 45, n = sr * sec;
  var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  SAMPLE = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  return SAMPLE;
}

var NAMES = ['晴天', '孤勇者', '起风了', '海底', '告白气球', '夜曲', '稻香', '简单爱', '七里香', '富士山下'];
var ARTISTS = ['周杰伦', '陈奕迅', '林俊杰', '邓紫棋', '李荣浩', '毛不易', '薛之谦', '张学友'];

/* Sample LRC so the lyric panel is visible in preview mode. */
var LYRIC_SAMPLE = [
  '[00:00.50]东哥音乐网 · 歌词预览',
  '[00:03.00]作词 : 示例',
  '[00:05.50]作曲 : 示例',
  '[00:08.00]故事的小黄花',
  '[00:11.50]从出生那年就飘着',
  '[00:15.00]童年的荡秋千',
  '[00:18.50]随记忆一直晃到现在',
  '[00:22.00]吹着前奏望着天空',
  '[00:25.50]我想起花瓣试着掉落',
  '[00:29.00]为你翘课的那一天',
  '[00:32.50]花落的那一天',
  '[00:36.00]教室的那一间',
  '[00:39.50]我怎么看不见',
  '[00:43.00]消失的下雨天',
  '[00:46.00]我好想再淋一遍'
].join('\n');

function tracks(prefix, n) {
  var out = [];
  for (var i = 0; i < n; i++) {
    out.push({
      id: 1000 + i + prefix.length * 100,
      name: prefix + ' · ' + NAMES[i % NAMES.length],
      artists: [{ name: ARTISTS[i % ARTISTS.length] }],
      album: { name: '专辑 ' + (i + 1) },
      duration: 180000 + i * 7000
    });
  }
  return out;
}

window.__dgMockBridge = function (msg, w) {
  w = w || window;
  if (msg.op === 'http') {
    var u = String(msg.url), body = '{}';
    if (u.indexOf('playlist/detail') >= 0) {
      body = JSON.stringify({ result: { tracks: tracks('榜单', 10) } });
    } else if (u.indexOf('music.163.com/api/search') >= 0) {
      body = JSON.stringify({ result: { songs: tracks('网易', 8) } });
    } else if (u.indexOf('kugou') >= 0) {
      body = JSON.stringify({ data: { lists: tracks('酷狗', 8).map(function (t, i) {
        return { FileHash: 'H' + i, SongName: t.name, SingerName: t.artists[0].name,
                 AlbumName: t.album.name, Duration: Math.round(t.duration / 1000) };
      }) } });
    } else if (u.indexOf('kuwo') >= 0) {
      body = "{'abslist':[" + tracks('酷我', 8).map(function (t, i) {
        return "{'MUSICRID':'MUSIC_" + (5000 + i) + "','SONGNAME':'" + t.name +
               "','ARTIST':'" + t.artists[0].name + "','ALBUM':'" + t.album.name +
               "','DURATION':" + Math.round(t.duration / 1000) + "}";
      }).join(',') + "]}";
    } else if (u.indexOf('search_all') >= 0) {
      body = JSON.stringify({ songResultData: { result: tracks('咪咕', 8).map(function (t, i) {
        return { id: 'M' + i, copyrightId: 'C' + i, contentId: 'CT' + i, name: t.name,
                 singers: t.artists, albums: [{ name: t.album.name }] };
      }) } });
    } else if (u.indexOf('client_search_cp') >= 0) {
      body = JSON.stringify({ data: { song: { list: [] } } });
    } else if (u.indexOf('song/lyric') >= 0) {
      body = JSON.stringify({ lrc: { lyric: LYRIC_SAMPLE } });
    }
    setTimeout(function () { if (w.__resp) w.__resp(msg.id, true, 200, '{}', body); }, 160);
    return;
  }
  if (msg.op === 'result') {
    setTimeout(function () { if (w.__onUrl) w.__onUrl(msg.id, silentWav()); }, 420);
    return;
  }
  if (msg.op === 'download') {
    var pct = 0;
    var t = setInterval(function () {
      pct += 20;
      if (w.__onProgress) w.__onProgress(msg.id, pct);
      if (pct >= 100) {
        clearInterval(t);
        if (w.__onDownload) w.__onDownload(msg.id, true, msg.name);
      }
    }, 200);
    return;
  }
  if (msg.op === 'store') {
    try { localStorage.setItem('dg_preview_state', msg.json); } catch (e) {}
  }
  if (msg.op === 'settimer') {
    /* Mirror the native NSTimer arm so the preview can be inspected. */
    window.__dgTimerMock = { until: msg.until, endstop: msg.endstop };
  }
};

var frame = document.getElementById('frame');

frame.addEventListener('load', function () {
  var w = frame.contentWindow;
  try {
    /* Playback: resolve every request to a locally generated silent track so
       the player UI (progress, next/prev, modes) is fully exercisable. */
    w.__invoke = function (id, source, quality, info) {
      setTimeout(function () { if (w.__onUrl) w.__onUrl(id, silentWav()); }, 380);
    };
    var saved = localStorage.getItem('dg_preview_state');
    if (saved && w.__initStore) w.__initStore(saved);

    /* Debug hooks for headless screenshots: preview.html#tab=search / #play */
    var q = (location.hash || '').replace(/^#/, '');
    if (q.indexOf('tab=') === 0) {
      setTimeout(function () {
        var btn = frame.contentDocument.querySelector('.tabbar [data-tab="' + q.slice(4) + '"]');
        if (btn) btn.click();
      }, 350);
    } else if (q === 'play') {
      setTimeout(function () {
        var b = frame.contentDocument.querySelector('#newSongs .s-ops button[data-act="play"]');
        if (b) b.click();
      }, 700);
    } else if (q === 'full') {
      setTimeout(function () {
        var b = frame.contentDocument.querySelector('#newSongs .s-ops button[data-act="play"]');
        if (b) b.click();
        setTimeout(function () {
          var m = frame.contentDocument.querySelector('#miniOpen') ||
                  frame.contentDocument.querySelector('#mini');
          if (m) m.click();
        }, 1800);
      }, 600);
    } else if (q === 'timer') {
      setTimeout(function () {
        var b = frame.contentDocument.querySelector('#newSongs .s-ops button[data-act="play"]');
        if (b) b.click();
        setTimeout(function () {
          var m = frame.contentDocument.querySelector('#miniOpen') ||
                  frame.contentDocument.querySelector('#mini');
          if (m) m.click();
          setTimeout(function () {
            var t = frame.contentDocument.querySelector('#btnTimer');
            if (t) t.click();
          }, 700);
        }, 1800);
      }, 600);
    }
  } catch (e) {}
});
</script>
</body>
</html>
