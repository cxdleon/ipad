<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>东哥音乐网</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">&#9834;</div>
    <div class="brandtext">
      <h1>东哥音乐网</h1>
      <p id="engineState">音源引擎加载中&hellip;</p>
    </div>
  </div>
  <div class="searchbar">
    <input id="q" type="search" placeholder="搜索歌曲 / 歌手" autocomplete="off" spellcheck="false">
    <button id="searchBtn" class="primary">搜索</button>
  </div>
  <div class="opts">
    <label for="quality">音质</label>
    <select id="quality">
      <option value="128k">标准 128k</option>
      <option value="320k">高品质 320k</option>
      <option value="flac">无损 FLAC</option>
      <option value="flac24bit">臻品 flac24bit</option>
    </select>
  </div>
</header>

<nav class="tabs">
  <button class="srctab active" data-src="all">全部</button>
  <button class="srctab" data-src="tx">QQ音乐</button>
  <button class="srctab" data-src="wy">网易云</button>
  <button class="srctab" data-src="kg">酷狗</button>
  <button class="srctab" data-src="kw">酷我</button>
  <button class="srctab" data-src="mg">咪咕</button>
  <span class="spacer"></span>
  <button id="favTab" class="srctab">收藏 <em id="favCount">0</em></button>
</nav>

<section class="listwrap">
  <div class="listhead">
    <span>歌曲</span><span>歌手</span><span>时长</span><span>来源</span><span>操作</span>
  </div>
  <div id="list" class="list"></div>
</section>

<footer class="player">
  <div class="pinfo">
    <div class="cover">&#9834;</div>
    <div class="ptext">
      <strong id="pTitle">未播放</strong>
      <small id="pArtist">选一首歌开始播放</small>
    </div>
  </div>
  <div class="pctrl">
    <button id="playBtn" class="round">&#9654;</button>
    <span id="curTime" class="time">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="totTime" class="time">0:00</span>
  </div>
  <div class="pvol">
    <span>音量</span>
    <input id="vol" type="range" min="0" max="100" value="80">
  </div>
</footer>

<div id="status" class="status">就绪 &middot; iPadOS 13 版</div>
<div id="toast" class="toast"></div>
<audio id="audio" preload="none"></audio>
