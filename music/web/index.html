<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>东哥音乐网</title>
<link rel="stylesheet" href="app.css">
<script>
/* iOS 13 的 WebKit 没有 flex 的 gap（Safari 14.1 才加），但 grid 的 gap 是支持的。
   这里量一次：column 方向两个 10px 子项 + gap:4px，支持则高 24，不支持则 20。
   不支持时给 <html> 打上 no-flexgap，由 app.css 末尾的兜底规则用 margin 补间距。 */
(function () {
  try {
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;flex-direction:column;gap:4px;position:absolute;' +
                      'top:-9999px;left:-9999px;width:10px;visibility:hidden';
    var a = document.createElement('div'), b = document.createElement('div');
    a.style.cssText = b.style.cssText = 'height:10px';
    d.appendChild(a); d.appendChild(b);
    document.documentElement.appendChild(d);
    var ok = d.offsetHeight >= 24;
    document.documentElement.removeChild(d);
    if (!ok) document.documentElement.className += ' no-flexgap';
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- On device this file is injected natively at document start (WKUserScript).
     The tag below makes the same bridge available when the page is opened in a
     plain browser (desktop preview); shim.js self-guards against double init. -->
<script src="shim.js"></script>

<div id="app">
  <header class="appbar">
    <div class="ab-left">
      <img class="logo" src="logo-mark.png" alt="东哥音乐网">
      <div class="ab-title">
        <strong id="abTitle">推荐</strong>
        <small id="engineState">取链引擎启动中&hellip;</small>
      </div>
    </div>
    <div class="ab-right">
      <button id="btnRefresh" class="iconbtn" title="刷新">&#8635;</button>
    </div>
  </header>

  <main id="views">

    <!-- ================= 推荐 ================= -->
    <section class="view" id="view-home">
      <div class="hero">
        <img class="hero-img" src="logo.jpg" alt="东哥音乐网">
        <div class="hero-fade"></div>
        <div class="hero-tags">
          <span class="tag">五源聚合</span>
          <span class="tag">同时检索</span>
          <span class="tag">实时更新</span>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h3>大家都在搜</h3><span class="hint">全网首发</span></div>
        <div class="chips" id="hotWords"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>热门榜单</h3><span class="hint" id="chartHint">个官方榜</span></div>
        <div class="chart-grid" id="chartGrid"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>新歌速递</h3><span class="hint">每日更新</span></div>
        <div class="song-list compact" id="newSongs"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>精品歌单</h3><span class="hint">编辑精选</span></div>
        <div class="pl-grid" id="curatedGrid"></div>
      </div>

      <div class="foot-note">
        内容来自公开接口 &middot; 播放链接由插件引擎实时解析 &middot; 仅用于个人试听
      </div>
    </section>

    <!-- ================= 搜索 ================= -->
    <section class="view" id="view-search">
      <div class="searchbar">
        <input id="q" type="search" placeholder="搜索歌曲 / 歌手" autocomplete="off" spellcheck="false">
        <button id="btnSearch" class="primary">搜索</button>
      </div>
      <div class="chips srcbar" id="srcBar"></div>

      <div id="searchHistoryBlock" class="block">
        <div class="block-head"><h3>搜索历史</h3><button class="linkbtn" id="btnClearHistory">清空</button></div>
        <div class="chips" id="historyChips"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3 id="resultTitle">五源聚合搜索</h3><span class="hint" id="resultHint">同时检索</span></div>
        <div class="song-list" id="searchResults"></div>
      </div>
    </section>

    <!-- ================= 收藏 ================= -->
    <section class="view" id="view-fav">
      <div class="block">
        <div class="block-head">
          <h3>我的收藏 <em id="favCount" class="count">0</em></h3>
          <div class="head-actions">
            <button class="linkbtn" id="btnPlayAllFav">播放全部</button>
            <button class="linkbtn danger" id="btnClearFav">清空</button>
          </div>
        </div>
        <div class="song-list" id="favList"></div>
      </div>
    </section>

    <!-- ================= 歌单 ================= -->
    <section class="view" id="view-playlist">
      <div id="plIndex">
        <div class="block">
          <div class="block-head">
            <h3>我的歌单</h3>
            <button class="linkbtn" id="btnNewPlaylist">新建歌单</button>
          </div>
          <div class="pl-list" id="playlistList"></div>
        </div>
      </div>
      <div id="plDetail" class="hidden">
        <div class="detail-head">
          <button class="iconbtn" id="btnPlBack">&#8592;</button>
          <div class="detail-title">
            <strong id="plName">歌单</strong>
            <small id="plMeta">0 首</small>
          </div>
          <div class="head-actions">
            <button class="linkbtn" id="btnPlayAllPl">播放全部</button>
            <button class="linkbtn danger" id="btnDelPl">删除</button>
          </div>
        </div>
        <div class="song-list" id="plSongs"></div>
      </div>
    </section>

    <!-- ================= 我的 ================= -->
    <section class="view" id="view-mine">
      <div class="block">
        <div class="block-head"><h3>最近播放</h3><button class="linkbtn" id="btnClearRecent">清空</button></div>
        <div class="song-list compact" id="recentList"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>下载</h3><span class="hint" id="dlHint">本地记录</span></div>
        <div class="song-list compact" id="downloadList"></div>
      </div>

      <div class="block">
        <div class="block-head"><h3>设置</h3></div>
        <div class="setting-row">
          <span>默认音质</span>
          <select id="setQuality">
            <option value="128k">标准 128k</option>
            <option value="320k">高品质 320k</option>
            <option value="flac">无损 FLAC</option>
            <option value="flac24bit">臻品 flac24bit</option>
          </select>
        </div>
        <div class="setting-row">
          <span>播放模式</span>
          <select id="setMode">
            <option value="list">列表循环</option>
            <option value="single">单曲循环</option>
            <option value="shuffle">随机播放</option>
          </select>
        </div>
        <div class="setting-row">
          <span>音源</span>
          <span class="setting-val" id="srcHealth">检测中&hellip;</span>
        </div>
      </div>

      <div class="block">
        <div class="block-head">
          <h3>诊断</h3>
          <span class="head-actions">
            <button class="linkbtn" id="btnCopyDiag">复制</button>
            <button class="linkbtn" id="btnClearDiag">清空</button>
          </span>
        </div>
        <div class="diag" id="diagList"></div>
      </div>

      <div class="foot-note">
        东哥音乐网 iPadOS 13 版 &middot; 五源引擎<br>
        内容来自公开接口 &middot; 仅用于个人试听
      </div>
    </section>
  </main>

  <!-- mini player -->
  <div id="mini" class="mini hidden">
    <button type="button" class="mini-open" id="miniOpen">
      <img class="mini-cover" src="logo-mark.png" alt="">
      <span class="mini-text">
        <strong id="miniTitle">未播放</strong>
        <small id="miniArtist">选一首歌开始</small>
      </span>
      <span class="mini-cue">&#9650;</span>
    </button>
    <button type="button" id="miniPlay" class="mini-btn">&#9654;</button>
    <button type="button" id="miniNext" class="mini-btn">&#9197;</button>
  </div>

  <!-- bottom tabs -->
  <nav class="tabbar">
    <button class="tab active" data-tab="home"><i>&#8962;</i><span>推荐</span></button>
    <button class="tab" data-tab="search"><i>&#9906;</i><span>搜索</span></button>
    <button class="tab" data-tab="fav"><i>&#9829;</i><span>收藏</span></button>
    <button class="tab" data-tab="playlist"><i>&#9776;</i><span>歌单</span></button>
    <button class="tab" data-tab="mine"><i>&#9786;</i><span>我的</span></button>
  </nav>
</div>

<!-- ================= full player ================= -->
<div id="full" class="full">
  <div class="full-bg"></div>
  <div class="full-top">
    <button class="iconbtn" id="btnCloseFull">&#9660;</button>
    <div class="full-head">
      <strong id="fullTitle">未播放</strong>
      <small id="fullArtist">&mdash;</small>
    </div>
    <button class="iconbtn" id="btnQueue">&#9776;</button>
  </div>

  <div class="full-body">
    <div class="full-cover" id="fullCover">&#9834;</div>
    <div class="full-lyric-wrap" id="lyricWrap">
      <div class="lyric-inner" id="lyricInner"><div class="lyric-empty">暂无歌词</div></div>
    </div>
    <div class="full-meta">
      <span id="fullSource">音源 &mdash;</span>
      <button class="pill" id="btnQuality">音质 128k</button>
    </div>
    <div class="full-extras">
      <div class="seg" id="orderSeg">
        <button type="button" data-mode="list">列表循环</button>
        <button type="button" data-mode="single">单曲循环</button>
        <button type="button" data-mode="shuffle">随机播放</button>
      </div>
      <button class="pill" id="btnTimer">定时关闭</button>
    </div>
  </div>

  <div class="full-ctrl">
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0">
      <span id="totTime">0:00</span>
    </div>
    <div class="ctrl-row">
      <button class="iconbtn big" id="btnPrev">&#9198;</button>
      <button class="playbtn" id="btnPlay">&#9654;</button>
      <button class="iconbtn big" id="btnNext">&#9197;</button>
      <button class="iconbtn" id="btnFavCur">&#9825;</button>
    </div>
  </div>
</div>

<!-- ================= sleep timer sheet ================= -->
<div id="timerSheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <strong>定时停止播放</strong>
      <span id="timerState">未开启</span>
      <button class="linkbtn" id="btnCloseTimer">收起</button>
    </div>
    <div class="timer-list">
      <button type="button" class="timer-opt" data-min="15">15 分钟后停止</button>
      <button type="button" class="timer-opt" data-min="30">30 分钟后停止</button>
      <button type="button" class="timer-opt" data-min="60">60 分钟后停止</button>
      <button type="button" class="timer-opt" data-min="90">90 分钟后停止</button>
      <button type="button" class="timer-opt" data-min="-2">播完当前这首后停止</button>
      <button type="button" class="timer-opt danger" data-min="-1">关闭定时</button>
    </div>
  </div>
</div>

<!-- ================= queue sheet ================= -->
<div id="sheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <strong>播放列表</strong>
      <span id="queueCount">0 首</span>
      <button class="linkbtn" id="btnCloseSheet">收起</button>
    </div>
    <div class="song-list" id="queueList"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<audio id="audio" preload="auto" playsinline webkit-playsinline></audio>

<!-- lx runtime: byte-for-byte the APK's assets/bridge.html logic -->
<script>
(function () {
  var seq = 0;
  var pending = {};
  var handler = null;

  function bridge() { return window.AndroidBridge || null; }

  window.__resp = function (id, ok, status, headersJson, body) {
    var p = pending[id];
    if (!p) return;
    delete pending[id];
    if (!ok) { p.reject(new Error('network_error')); return; }
    var headers = {};
    try { headers = JSON.parse(headersJson || '{}'); } catch (e) {}
    p.resolve({ statusCode: status, headers: headers, body: body == null ? '' : body, raw: body });
  };

  function md5(s) {
    var b = bridge();
    try { return b ? b.md5(String(s)) : ''; } catch (e) { return ''; }
  }

  window.lx = {
    EVENT_NAMES: { request: 'request', inited: 'inited', updateAlert: 'updateAlert' },
    version: '2.6.0',
    env: 'desktop',
    on: function (name, fn) { if (name === 'request') handler = fn; },
    send: function (name, data) {
      var b = bridge();
      if (!b) return;
      try {
        if (name === 'inited') b.onInited(JSON.stringify(data || {}));
        else if (name === 'updateAlert') b.onAlert(JSON.stringify(data || {}));
      } catch (e) {}
    },
    request: function (url, options, callback) {
      if (typeof options === 'function') { callback = options; options = {}; }
      var opts = options || {};
      var p = new Promise(function (resolve, reject) {
        var id = ++seq;
        var timer = setTimeout(function () {
          if (pending[id]) { delete pending[id]; reject(new Error('timeout')); }
        }, (opts.timeout || 15000) + 2000);
        pending[id] = {
          resolve: function (v) { clearTimeout(timer); resolve(v); },
          reject: function (e) { clearTimeout(timer); reject(e); }
        };
        var b = bridge();
        if (!b) { delete pending[id]; clearTimeout(timer); reject(new Error('no_bridge')); return; }
        try { b.http(id, String(url), JSON.stringify(opts)); }
        catch (e) { delete pending[id]; clearTimeout(timer); reject(e); }
      });
      if (typeof callback === 'function') {
        p.then(function (r) { callback(null, r); }, function (e) { callback(e, null); });
        return undefined;
      }
      return p;
    },
    utils: {
      crypto: {
        md5: md5,
        aesEncrypt: function () { return ''; },
        aesDecrypt: function () { return ''; },
        rsaEncrypt: function () { return ''; },
        randomBytes: function (n) {
          var a = new Uint8Array(n || 16);
          if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
          return a;
        }
      },
      buffer: {
        bufToRaw: function (b) { return b; },
        bufToString: function (b) { return String(b); },
        rawToBuf: function (b) { return b; }
      }
    }
  };

  window.__engineHandlerType = function () { return typeof handler; };

  window.__invoke = function (callId, source, quality, infoJson) {
    var log = function (m) { if (window.__dgLog) window.__dgLog('engine', m); };
    var done = function (url) {
      var b = bridge();
      try { b.onResult(callId, url == null ? '' : String(url)); } catch (e) {}
    };
    if (typeof handler !== 'function') {
      log('no_handler source=' + source + ' type=' + typeof handler);
      done(''); return;
    }
    log('invoke ' + source + ' ' + quality);
    var info;
    try { info = JSON.parse(infoJson || '{}'); } catch (e) { info = {}; }
    try {
      var r = handler({ source: source, action: 'musicUrl', info: { type: quality, musicInfo: info } });
      Promise.resolve(r).then(function (v) {
        if (typeof v === 'string') {
          if (!v) log('resolved EMPTY string ' + source);
          done(v);
        } else if (v && (v.url || v.data)) {
          done(v.url || v.data);
        } else {
          log('resolved junk ' + source + ' ' + Object.prototype.toString.call(v) + ' ' + String(v).slice(0, 80));
          done('');
        }
      }, function (e) {
        log('handler REJECTED ' + source + ' ' + ((e && (e.name + ': ' + e.message)) || String(e)));
        done('');
      });
    } catch (e) {
      log('handler THREW ' + source + ' ' + ((e && (e.name + ': ' + e.message)) || String(e)));
      done('');
    }
  };

  window.__engineReady = false;
  window.__markReady = function () {
    window.__engineReady = true;
    var b = bridge();
    if (b) { try { b.onLoaded(); } catch (e) {} }
  };
})();
</script>

<!-- original obfuscated "五源合一" source engine, reused unchanged -->
<script src="plugin.js"></script>
<script>
  try { window.__markReady(); } catch (e) {}
  window.__engineHandlerAtLoad = window.__engineHandlerType ? window.__engineHandlerType() : '?';
</script>

<script src="app.js"></script>
</body>
</html>
